<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rekovr Logo — Square Dark 1080</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1080px;
    background: #0F1117;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Manrope', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .logo {
    font-weight: 800;
    font-size: 240px;
    letter-spacing: -0.04em;
    color: #FFFFFF;
    line-height: 1;
    display: inline-block;
  }
  .k-bicolor { position: relative; display: inline-block; }
  .k-bicolor .k-left  { display: inline-block; color: inherit; clip-path: inset(0 61% 0 0); }
  .k-bicolor .k-right { position: absolute; left: 0; top: 0; display: inline-block; color: #14B8A6; clip-path: inset(0 0 0 42%); }
  .dot { color: #14B8A6; }
</style>
</head>
<body>
  <span class="logo">re<span class="k-bicolor"><span class="k-left">k</span><span class="k-right">k</span></span>ovr<span class="dot">.</span></span>
</body>
</html>
